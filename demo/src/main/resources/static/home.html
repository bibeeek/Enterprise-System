<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f4f4; min-height: 100vh; }

        .navbar {
            background: #007bff;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 { font-size: 20px; }
        .navbar button {
            background: white;
            color: #007bff;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .navbar button:hover { background: #e0e0e0; }

        .dashboard { max-width: 1000px; margin: 30px auto; padding: 0 20px; }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.08);
            padding: 25px;
            margin-bottom: 25px;
        }
        .card h2 {
            font-size: 18px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            color: #333;
        }

        .user-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .user-field label { display: block; font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
        .user-field span  { font-size: 15px; font-weight: 500; color: #333; }

        .dept-badge { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 13px; font-weight: 500; }
        .dept-assigned   { background: #cce5ff; color: #004085; }
        .dept-unassigned { background: #f8d7da; color: #721c24; }

        .edit-form { display: none; margin-top: 20px; border-top: 1px solid #f0f0f0; padding-top: 20px; }
        .edit-form.open { display: block; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        .input-group input { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }

        .btn { padding: 9px 18px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-primary   { background: #007bff; color: white; }
        .btn-primary:hover { background: #0056b3; }
        .btn-secondary { background: #6c757d; color: white; margin-left: 8px; }
        .btn-secondary:hover { background: #545b62; }
        .btn-success   { background: #28a745; color: white; }
        .btn-success:hover { background: #1e7e34; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #f8f9fa; text-align: left; padding: 10px 12px; color: #555; font-size: 12px; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #f0f0f0; color: #333; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafafa; }

        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .badge-todo       { background: #fff3cd; color: #856404; }
        .badge-inprogress { background: #cce5ff; color: #004085; }
        .badge-done       { background: #d4edda; color: #155724; }
        .badge-cancelled  { background: #f8d7da; color: #721c24; }
        .badge-overdue    { background: #f8d7da; color: #721c24; }

        .msg { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; display: none; }
        .msg.show { display: block; }
        .msg-success { background: #d4edda; color: #155724; }
        .msg-error   { background: #f8d7da; color: #721c24; }

        .loading { text-align: center; color: #888; padding: 30px; }
        .empty   { text-align: center; color: #aaa; padding: 30px; font-size: 14px; }
    </style>
</head>
<body>

<div class="navbar">
    <h1>Dashboard</h1>
    <button onclick="logout()">Logout</button>
</div>

<div class="dashboard">

    <!-- USER DETAILS CARD -->
    <div class="card">
        <h2>My Profile</h2>
        <div id="userMsg" class="msg"></div>
        <div id="userLoading" class="loading">Loading profile...</div>

        <div id="userDetails" style="display:none;">
            <div class="user-grid">
                <div class="user-field"><label>Username</label><span id="u-userName"></span></div>
                <div class="user-field"><label>Full Name</label><span id="u-fullName"></span></div>
                <div class="user-field"><label>Email</label><span id="u-email"></span></div>
                <div class="user-field"><label>Phone</label><span id="u-phone"></span></div>
                <div class="user-field"><label>Address</label><span id="u-address"></span></div>
                <div class="user-field"><label>Role</label><span id="u-role"></span></div>
                <!-- department — shows blue badge if assigned, red if not -->
                <div class="user-field">
                    <label>Department</label>
                    <span id="u-department"></span>
                </div>
            </div>
            <br>
            <button class="btn btn-primary" onclick="toggleEditForm()">Edit Profile</button>
        </div>

        <div class="edit-form" id="editForm">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="edit-fullName" placeholder="Full Name">
            </div>
            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" id="edit-phone" placeholder="Phone Number">
            </div>
            <div class="input-group">
                <label>Address</label>
                <input type="text" id="edit-address" placeholder="Address">
            </div>
            <button class="btn btn-success" onclick="updateUserDetails()">Save Changes</button>
            <button class="btn btn-secondary" onclick="toggleEditForm()">Cancel</button>
        </div>
    </div>

    <!-- TASKS CARD -->
    <div class="card">
        <h2>My Tasks</h2>
        <div id="taskMsg" class="msg"></div>
        <div id="taskLoading" class="loading">Loading tasks...</div>

        <div id="taskContainer" style="display:none;">
            <table>
                <thead>
                <tr>
                    <th>Task Name</th>
                    <th>Description</th>
                    <th>Priority</th>
                    <th>Category</th>
                    <th>Deadline</th>
                    <th>Est. Hours</th>
                    <th>Department</th>
                    <th>Assigned To</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="taskTableBody"></tbody>
            </table>
        </div>

        <div id="taskEmpty" class="empty" style="display:none;">No tasks assigned to you yet.</div>
    </div>

</div>

<script src="home.js"></script>
</body>
</html>
