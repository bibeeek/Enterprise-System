<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
        }

        .container{
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group{
            margin-bottom: 15px;
        }

        .input-group label{
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input-group input{
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button{
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover{
            background: #1e7e34;
        }

        .link{
            text-align: center;
            margin-top: 15px;
        }

        .link a{
            text-decoration: none;
            color: #007bff;
        }

    </style>

</head>
<body>

<div class="container">

    <h2>Login</h2>

    <form id="loginForm">

        <div class="input-group">
            <label>Email</label>
            <input type="email" name="email" id="email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="passWord"  id="password" required>
        </div>

         <button type="submit">Login</button>

    </form>

    <div class="link">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

</div>
<script src="auth.js"></script>

</body>
</html>
